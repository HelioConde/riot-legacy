name: Visual Snapshots

on:
  workflow_run:
    workflows:
      - Deploy GitHub Pages
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visual-snapshots
  cancel-in-progress: true

jobs:
  capture:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture full-page screenshots
        env:
          SCREENSHOT_BASE_URL: https://helioconde.github.io/riot-legacy/
          SCREENSHOT_OUTPUT_DIR: visual-snapshots
        run: npm run screenshot

      - name: Commit updated visual snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visual-snapshots
          if git diff --cached --quiet; then
            echo "No visual changes to commit."
            exit 0
          fi
          git commit -m "chore: update visual snapshots [skip ci]"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push race on attempt $attempt; retrying..."
            sleep $((attempt * 2))
          done
          echo "Could not push visual snapshots after retries."
          exit 1
